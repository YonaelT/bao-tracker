<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Baobab Pro — Interactive Progress Map</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            canvas: '#09090b',
            panel: '#121215',
            borderDark: '#22222a',
            accent: '#3b82f6',
          },
          boxShadow: {
            'glass': '0 8px 32px 0 rgba(0, 0, 0, 0.45)',
            'glow': '0 0 25px -5px var(--tw-shadow-color)',
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600;800&display=swap');

    * { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #262630; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #3f3f50; }

    @keyframes odometer-up {
      0% { transform: translateY(8px); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }
    .animate-odo { animation: odometer-up 0.18s cubic-bezier(0.16, 1, 0.3, 1); }

    @keyframes pulse-glow {
      0%, 100% { filter: brightness(1); }
      50% { filter: brightness(1.4) drop-shadow(0 0 12px rgba(255, 255, 255, 0.3)); }
    }
    .parent-pulse { animation: pulse-glow 0.6s ease-in-out; }

    path.sector { transition: opacity 0.3s ease, stroke-width 0.2s ease; cursor: pointer; }
    path.sector:hover { opacity: 0.88 !important; stroke: #ffffff !important; stroke-width: 2px !important; }
    path.sector.search-highlight { stroke: #fbbf24 !important; stroke-width: 3px !important; filter: drop-shadow(0 0 10px #fbbf24); }

    .glass-panel {
      background: rgba(18, 18, 21, 0.88);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
    }

    /* Ensure text along arcs renders cleanly */
    textPath {
      dominant-baseline: central;
    }
  </style>
</head>
<body class="bg-canvas text-gray-100 flex h-screen w-screen overflow-hidden select-none relative">

  <!-- 1. AMBIENT WHITE FLOATING PARTICLES BACKGROUND -->
  <canvas id="particle-canvas" class="fixed inset-0 pointer-events-none z-0"></canvas>

  <!-- 2. TOP BREADCRUMB NAVIGATION -->
  <div class="absolute top-5 left-6 z-20 pointer-events-none flex items-center gap-3">
    <div id="breadcrumbs" class="pointer-events-auto flex items-center gap-1.5 bg-panel/90 border border-borderDark px-4 py-2.5 rounded-xl shadow-2xl backdrop-blur-md text-xs font-semibold tracking-wide overflow-x-auto max-w-xl">
      <!-- Dynamically populated -->
    </div>
  </div>

  <!-- 3. PROMINENT FLOATING SIDEBAR TOGGLE BUTTON -->
  <button onclick="toggleSidebar()" id="btn-toggle-sidebar"
    style="right: 395px;"
    class="fixed top-5 z-50 bg-panel/95 border-2 border-accent/80 hover:border-accent text-white px-4 py-2.5 rounded-xl text-xs font-bold shadow-2xl backdrop-blur-xl flex items-center gap-2.5 transition-all duration-300 hover:scale-105 active:scale-95 shadow-glow shadow-accent/20 cursor-pointer">
    <span class="text-base leading-none">☰</span>
    <span id="sidebar-toggle-text">Hide Sidebar</span>
  </button>

  <!-- 4. HOVER TOOLTIP -->
  <div id="tooltip" class="fixed hidden z-50 pointer-events-none bg-panel/95 border border-borderDark px-3.5 py-2.5 rounded-xl shadow-2xl backdrop-blur-md text-xs transition-opacity duration-150"></div>

  <!-- 5. CENTER: D3 INFINITE CANVAS & SUNBURST -->
  <div class="flex-1 h-full relative overflow-hidden transition-all duration-300 z-10" id="main-content" style="margin-right: 380px;">
    <div id="chart" class="w-full h-full cursor-grab active:cursor-grabbing"></div>

    <!-- Camera Reset Button -->
    <button id="btn-reset-cam" onclick="resetCamera()"
      class="absolute bottom-6 right-6 bg-panel/90 border border-borderDark hover:border-accent px-3 py-1.5 rounded-lg text-xs text-gray-300 hover:text-white shadow-xl backdrop-blur-md hidden pointer-events-auto transition">
      ⌖ Reset Camera View
    </button>

    <!-- Autosave Indicator -->
    <div class="absolute bottom-6 left-6 flex items-center gap-2 pointer-events-none">
      <div id="save-indicator" class="bg-panel/80 border border-borderDark/80 px-3 py-1.5 rounded-md text-[11px] text-gray-400 backdrop-blur-sm flex items-center gap-2 transition-opacity duration-300 opacity-0">
        <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
        <span>Snapshot Saved</span>
      </div>
    </div>
  </div>

  <!-- 6. RIGHT SIDEBAR: PRO INSPECTOR -->
  <div id="sidebar" class="fixed top-0 right-0 w-[380px] h-full glass-panel border-l border-borderDark flex flex-col z-40 shadow-2xl transition-transform duration-300 ease-in-out translate-x-0">

    <!-- Top Bar: Undo/Redo & Node Metadata -->
    <div class="p-5 border-b border-borderDark bg-black/20 flex flex-col gap-3.5 pt-6">
      <div class="flex items-center justify-between text-xs text-gray-400 font-medium">
        <span id="sidebar-depth-label" class="text-accent uppercase tracking-wider font-bold">Root Overview</span>
        <div class="flex items-center gap-1">
          <button onclick="toggleSidebarSearch()" title="Search Nodes" class="px-2 py-1 bg-white/5 hover:bg-white/10 rounded text-gray-300 transition flex items-center gap-1 mr-1">
            <span>🔍</span> <span class="text-[11px]">Search</span>
          </button>
          <button onclick="undo()" id="btn-undo" title="Undo (Ctrl+Z)" disabled class="p-1 hover:bg-white/10 rounded disabled:opacity-25 transition">↩</button>
          <button onclick="redo()" id="btn-redo" title="Redo (Ctrl+Y)" disabled class="p-1 hover:bg-white/10 rounded disabled:opacity-25 transition">↪</button>
          <button onclick="exportJSON()" title="Export Backup JSON" class="p-1 hover:bg-white/10 rounded text-gray-300 transition ml-1">💾</button>
        </div>
      </div>

      <!-- Inline Sidebar Search Box (Hidden by default) -->
      <div id="sidebar-search-box" class="hidden flex-col gap-2 pt-1 pb-2 border-b border-borderDark/50 animate-fade-in">
        <div class="flex items-center gap-2 bg-black/50 border border-borderDark rounded-lg px-2.5 py-1.5">
          <span class="text-gray-500 text-xs">🔍</span>
          <input type="text" id="sidebar-search-input" placeholder="Type to filter & highlight..."
            class="w-full bg-transparent text-xs text-white placeholder-gray-500 focus:outline-none">
          <button onclick="toggleSidebarSearch()" class="text-gray-500 hover:text-white text-xs">✕</button>
        </div>
        <div id="sidebar-search-results" class="max-h-36 overflow-y-auto space-y-1 text-xs divide-y divide-borderDark/30"></div>
      </div>

      <div class="flex items-baseline justify-between gap-2">
        <div class="flex items-center gap-2 flex-1 overflow-hidden">
          <h1 class="text-xl font-bold text-white tracking-tight truncate" id="sidebar-title">Total</h1>
          <button onclick="renameCurrentNode()" title="Rename Node" class="text-gray-400 hover:text-white p-1 rounded hover:bg-white/10 text-xs transition">✎</button>
        </div>
        <div class="text-right">
          <div class="text-2xl font-extrabold text-white font-mono tracking-tight" id="sidebar-total">0</div>
          <div class="text-[10px] text-gray-400 font-mono uppercase tracking-wider">TOTAL VALUE</div>
        </div>
      </div>

      <!-- Progress Bar (Share of Parent) -->
      <div class="w-full bg-white/5 h-1.5 rounded-full overflow-hidden flex">
        <div id="sidebar-progress-bar" class="bg-accent h-full transition-all duration-500" style="width: 100%;"></div>
      </div>
      <div class="flex justify-between text-[10px] text-gray-400 font-mono">
        <span id="sidebar-share-parent">100% of parent</span>
        <span id="sidebar-share-total">100% of total</span>
      </div>
    </div>

    <!-- Children List -->
    <div class="px-5 py-3 text-[11px] font-bold uppercase tracking-wider text-gray-400 border-b border-borderDark/50 flex justify-between items-center">
      <span>Sub-Sections (<span id="child-count">0</span>)</span>
      <span class="text-[9px] text-gray-500 font-normal lowercase">drag to reorder</span>
    </div>

    <div class="flex-1 overflow-y-auto p-4 space-y-2" id="children-container">
      <!-- Dynamically rendered -->
    </div>

    <!-- Footer: Quick Append Form -->
    <div class="p-4 border-t border-borderDark bg-black/30">
      <form id="add-form" class="flex gap-2" onsubmit="handleCreateChild(event)">
        <input type="text" id="new-child-name" placeholder="New category name..." required
          class="flex-1 bg-black/50 border border-borderDark rounded-lg px-3 py-1.5 text-xs text-white placeholder-gray-500 focus:outline-none focus:border-accent transition">
        <input type="number" id="new-child-val" placeholder="Val" value="10" min="0" step="any"
          class="w-16 bg-black/50 border border-borderDark rounded-lg px-2 py-1.5 text-xs text-white text-center font-mono focus:outline-none focus:border-accent transition">
        <button type="submit"
          class="bg-accent hover:bg-blue-600 active:scale-95 text-white text-xs font-semibold px-3 py-1.5 rounded-lg transition shadow-glow shadow-accent/20">
          + Add
        </button>
      </form>
    </div>
  </div>

  <!-- RIGHT CLICK CONTEXT MENU -->
  <div id="context-menu" class="fixed hidden z-50 w-48 bg-panel/95 border border-borderDark rounded-xl shadow-2xl backdrop-blur-2xl py-1.5 text-xs divide-y divide-borderDark/50 font-medium">
    <div class="py-1">
      <button onclick="ctxAction('add')" class="w-full px-4 py-2 text-left hover:bg-white/10 flex items-center gap-2 text-gray-200">
        <span class="text-accent">+</span> Add Child Node
      </button>
      <button onclick="ctxAction('rename')" class="w-full px-4 py-2 text-left hover:bg-white/10 flex items-center gap-2 text-gray-200">
        <span>✎</span> Rename Section
      </button>
    </div>
    <div class="py-1">
      <button onclick="ctxAction('duplicate')" class="w-full px-4 py-2 text-left hover:bg-white/10 flex items-center gap-2 text-gray-200">
        <span>⧉</span> Duplicate Subtree
      </button>
    </div>
    <div class="py-1">
      <button onclick="ctxAction('delete')" class="w-full px-4 py-2 text-left hover:bg-red-500/20 text-red-400 flex items-center gap-2">
        <span>✕</span> Delete Branch
      </button>
    </div>
  </div>

  <script>
    // --- 1. AMBIENT WHITE FLOATING PARTICLES CANVAS ---
    const pCanvas = document.getElementById('particle-canvas');
    const pCtx = pCanvas.getContext('2d');
    let particles = [];

    function initParticles() {
      pCanvas.width = window.innerWidth;
      pCanvas.height = window.innerHeight;
      particles = [];
      // Triple density: ~150+ particles on standard desktop
      const count = Math.floor((window.innerWidth * window.innerHeight) / 8000);
      for (let i = 0; i < Math.min(count, 180); i++) {
        particles.push({
          x: Math.random() * pCanvas.width,
          y: Math.random() * pCanvas.height,
          // Varying small sizes from tiny 0.4px specks to 2.2px dots
          r: Math.random() * 1.8 + 0.4,
          // Varying speeds and directions
          dx: (Math.random() - 0.5) * (Math.random() * 1.2 + 0.2),
          dy: (Math.random() - 0.5) * (Math.random() * 1.2 + 0.2) - 0.1,
          alpha: Math.random() * 0.65 + 0.15
        });
      }
    }

    function animateParticles() {
      pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
      particles.forEach(p => {
        p.x += p.dx;
        p.y += p.dy;
        if (p.x < 0) p.x = pCanvas.width;
        if (p.x > pCanvas.width) p.x = 0;
        if (p.y < 0) p.y = pCanvas.height;
        if (p.y > pCanvas.height) p.y = 0;
        pCtx.beginPath();
        pCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        // Pure white particles
        pCtx.fillStyle = `rgba(255, 255, 255, ${p.alpha})`;
        pCtx.fill();
      });
      requestAnimationFrame(animateParticles);
    }
    window.addEventListener('resize', initParticles);
    initParticles();
    animateParticles();

    // --- 2. SIDEBAR TOGGLE & RESIZE ENGINE ---
    let sidebarOpen = true;
    function toggleSidebar() {
      sidebarOpen = !sidebarOpen;
      const sb = document.getElementById("sidebar");
      const main = document.getElementById("main-content");
      const text = document.getElementById("sidebar-toggle-text");
      const btn = document.getElementById("btn-toggle-sidebar");

      if (sidebarOpen) {
        sb.classList.remove("translate-x-full");
        main.style.marginRight = "380px";
        btn.style.right = "395px";
        text.innerText = "Hide Sidebar";
      } else {
        sb.classList.add("translate-x-full");
        main.style.marginRight = "0px";
        btn.style.right = "20px";
        text.innerText = "Show Sidebar";
      }
      setTimeout(() => renderSunburst(), 310);
    }

    // --- 3. PERSISTENCE ENGINE ---
    const DB_NAME = 'BaobabProDB';
    const STORE_NAME = 'treeStoreV2';
    let dbInstance = null;
    let historyStack = [];
    let redoStack = [];
    const MAX_HISTORY = 40;

    async function initDB() {
      return new Promise((resolve) => {
        const req = indexedDB.open(DB_NAME, 3);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) db.createObjectStore(STORE_NAME);
        };
        req.onsuccess = (e) => { dbInstance = e.target.result; resolve(true); };
        req.onerror = () => resolve(false);
      });
    }

    async function saveState(pushHistory = true) {
      if (pushHistory) {
        historyStack.push(JSON.stringify(treeData));
        if (historyStack.length > MAX_HISTORY) historyStack.shift();
        redoStack = [];
        updateUndoRedoButtons();
      }
      if (dbInstance) {
        const tx = dbInstance.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).put(treeData, 'rootTree');
      } else {
        localStorage.setItem('BaobabV2_tree', JSON.stringify(treeData));
      }
      showSaveIndicator();
    }

    function undo() {
      if (historyStack.length === 0) return;
      redoStack.push(JSON.stringify(treeData));
      treeData = JSON.parse(historyStack.pop());
      saveState(false);
      updateUndoRedoButtons();
      renderSunburst();
    }

    function redo() {
      if (redoStack.length === 0) return;
      historyStack.push(JSON.stringify(treeData));
      treeData = JSON.parse(redoStack.pop());
      saveState(false);
      updateUndoRedoButtons();
      renderSunburst();
    }

    function updateUndoRedoButtons() {
      document.getElementById('btn-undo').disabled = historyStack.length === 0;
      document.getElementById('btn-redo').disabled = redoStack.length === 0;
    }

    function showSaveIndicator() {
      const ind = document.getElementById('save-indicator');
      ind.style.opacity = '1';
      clearTimeout(window._saveTimer);
      window._saveTimer = setTimeout(() => ind.style.opacity = '0', 1800);
    }

    // --- 4. DEFAULT PLACEHOLDER SCHEMA ---
    const defaultData = {
      id: "root", name: "Total", color: "#3b82f6",
      children: [
        {
          id: "top_a", name: "Topic A", color: "#3b82f6",
          children: [
            { id: "a_1", name: "Task 1", value: 10 },
            { id: "a_2", name: "Task 2", value: 20 },
            { id: "a_3", name: "Task 3", value: 15 },
            { id: "a_4", name: "Task 4", value: 25 }
          ]
        },
        {
          id: "top_b", name: "Topic B", color: "#10b981",
          children: [
            { id: "b_1", name: "Task 1", value: 30 },
            { id: "b_2", name: "Task 2", value: 15 },
            { id: "b_3", name: "Task 3", value: 20 },
            { id: "b_4", name: "Task 4", value: 35 }
          ]
        }
      ]
    };

    let treeData = defaultData;
    let currentFocusId = "root";
    let selectedNodeId = "root";
    let ctxTargetId = null;

    // --- 5. D3 SUNBURST ENGINE WITH CURVED TEXT WRAPPING ---
    const baseHues = ["#3b82f6", "#10b981", "#8b5cf6", "#f59e0b", "#ec4899", "#06b6d4"];
    function getSectorColors(d) {
      if (d.depth === 0) return { fill: "#18181c", stroke: "#262630" };
      let ancestor = d;
      while (ancestor.depth > 1) ancestor = ancestor.parent;

      let base = ancestor.data.color || baseHues[ancestor.parent.children.indexOf(ancestor) % baseHues.length];
      ancestor.data.color = base;

      const c = d3.hsl(base);
      const idx = d.parent ? d.parent.children.indexOf(d) : 0;
      c.s = Math.max(0.35, c.s - (d.depth - 1) * 0.12);
      c.l = Math.max(0.22, Math.min(0.75, c.l + (idx * 0.07) - ((d.depth - 1) * 0.05)));

      const gradientEnd = d3.hsl(c);
      gradientEnd.l = Math.max(0.15, c.l - 0.12);

      return { fill: c.toString(), end: gradientEnd.toString() };
    }

    const container = document.getElementById('main-content');
    let width = Math.min(container.clientWidth, container.clientHeight) * 0.92;
    let radius = width / 6;

    const svg = d3.select("#chart").append("svg")
      .attr("viewBox", `-${width / 2} -${width / 2} ${width} ${width}`)
      .attr("class", "w-full h-full max-w-5xl max-h-5xl drop-shadow-2xl overflow-visible");

    const defs = svg.append("defs");
    const labelDefs = svg.append("defs").attr("id", "label-arc-defs");
    const cameraGroup = svg.append("g").attr("id", "camera-group");

    const zoomBehavior = d3.zoom()
      .scaleExtent([0.3, 5])
      .on("zoom", (e) => {
        cameraGroup.attr("transform", e.transform);
        document.getElementById('btn-reset-cam').style.display =
          (e.transform.k !== 1 || e.transform.x !== 0 || e.transform.y !== 0) ? 'block' : 'none';
      });

    d3.select("#chart").call(zoomBehavior).on("dblclick.zoom", null);

    function resetCamera() {
      d3.select("#chart").transition().duration(600).ease(d3.easeCubicOut)
        .call(zoomBehavior.transform, d3.zoomIdentity);
    }

    const arc = d3.arc()
      .startAngle(d => d.x0)
      .endAngle(d => d.x1)
      .padAngle(d => Math.min((d.x1 - d.x0) / 2, 0.007))
      .padRadius(radius * 1.5)
      .innerRadius(d => d.y0 * radius)
      .outerRadius(d => Math.max(d.y0 * radius, d.y1 * radius - 2));

    // Helper: Generate circular SVG path along the middle radius of a sector for <textPath>
    function getMiddleArcPath(d) {
      const r = (d.target.y0 + d.target.y1) / 2 * radius;
      let a0 = d.target.x0;
      let a1 = d.target.x1;
      if (a1 <= a0 || r <= 0) return "M 0 0";

      const midAngle = (a0 + a1) / 2;
      // If arc is in bottom half of circle (90 deg to 270 deg), reverse arc direction so text reads upright
      const isBottom = midAngle > Math.PI / 2 && midAngle < 3 * Math.PI / 2;

      if (isBottom) {
        const x0 = r * Math.sin(a1);
        const y0 = -r * Math.cos(a1);
        const x1 = r * Math.sin(a0);
        const y1 = -r * Math.cos(a0);
        const largeArc = (a1 - a0) > Math.PI ? 1 : 0;
        return `M ${x0} ${y0} A ${r} ${r} 0 ${largeArc} 0 ${x1} ${y1}`;
      } else {
        const x0 = r * Math.sin(a0);
        const y0 = -r * Math.cos(a0);
        const x1 = r * Math.sin(a1);
        const y1 = -r * Math.cos(a1);
        const largeArc = (a1 - a0) > Math.PI ? 1 : 0;
        return `M ${x0} ${y0} A ${r} ${r} 0 ${largeArc} 1 ${x1} ${y1}`;
      }
    }

    let root, path, labelGroup;

    function renderSunburst() {
      defs.selectAll("linearGradient").remove();
      labelDefs.selectAll("*").remove();
      cameraGroup.selectAll("*").remove();

      width = Math.min(container.clientWidth, container.clientHeight) * 0.92;
      radius = width / 6;
      svg.attr("viewBox", `-${width / 2} -${width / 2} ${width} ${width}`);

      root = d3.hierarchy(treeData)
        .sum(d => (!d.children || d.children.length === 0) ? (Number(d.value) || 0) : 0)
        .sort((a, b) => b.value - a.value);

      d3.partition().size([2 * Math.PI, root.height + 1])(root);

      // Center Dashboard Disc
      const centerDisc = cameraGroup.append("g").attr("class", "center-disc");
      centerDisc.append("circle")
        .attr("r", radius * 0.96)
        .attr("fill", "#121215")
        .attr("stroke", "#262630")
        .attr("stroke-width", 2.5)
        .attr("class", "cursor-pointer transition hover:fill-[#1a1a20]")
        .on("click", () => {
          const cur = findD3Node(currentFocusId);
          if (cur && cur.parent) focusOn(cur.parent.data.id);
        })
        .on("contextmenu", (event) => {
          event.preventDefault(); event.stopPropagation();
          selectNode("root");
          showContextMenu(event.pageX, event.pageY, "root");
        });

      centerDisc.append("text").attr("class", "center-title text-base font-bold fill-white text-anchor-middle tracking-tight").attr("text-anchor", "middle").attr("dy", "-0.6em");
      centerDisc.append("text").attr("class", "center-val text-2xl font-mono font-extrabold fill-accent text-anchor-middle").attr("text-anchor", "middle").attr("dy", "0.7em");
      centerDisc.append("text").attr("class", "center-sub text-[9px] uppercase tracking-widest fill-gray-400 text-anchor-middle").attr("text-anchor", "middle").attr("dy", "3.2em");

      const nodes = root.descendants().slice(1);

      nodes.forEach(d => {
        const colors = getSectorColors(d);
        const gradId = `grad-${d.data.id}`;
        const grad = defs.append("linearGradient").attr("id", gradId).attr("x1", "0%").attr("y1", "0%").attr("x2", "100%").attr("y2", "100%");
        grad.append("stop").attr("offset", "0%").attr("stop-color", colors.fill);
        grad.append("stop").attr("offset", "100%").attr("stop-color", colors.end);
        d.gradId = gradId;
      });

      const tooltip = document.getElementById("tooltip");

      path = cameraGroup.append("g")
        .selectAll("path")
        .data(nodes)
        .join("path")
        .attr("id", d => `arc-${d.data.id}`)
        .attr("class", "sector")
        .attr("fill", d => `url(#${d.gradId})`)
        .attr("stroke", "#09090b")
        .attr("stroke-width", 1.5)
        .attr("d", d => arc(d.current || d))
        .on("mousemove", (event, p) => {
          tooltip.classList.remove("hidden");
          tooltip.style.left = `${Math.min(event.pageX + 15, window.innerWidth - 180)}px`;
          tooltip.style.top = `${Math.min(event.pageY + 15, window.innerHeight - 80)}px`;

          const parentVal = p.parent ? p.parent.value : p.value;
          const share = parentVal > 0 ? ((p.value / parentVal) * 100).toFixed(1) : "100";

          tooltip.innerHTML = `
            <div class="font-bold text-white text-sm">${p.data.name}</div>
            <div class="text-gray-300 font-mono mt-1 flex justify-between gap-4">
              <span>Value:</span> <strong class="text-accent">${p.value || 0}</strong>
            </div>
            <div class="text-[10px] text-gray-400 font-mono mt-0.5">${share}% of ${p.parent.data.name}</div>
          `;
        })
        .on("mouseleave", () => tooltip.classList.add("hidden"))
        .on("click", (event, p) => {
          event.stopPropagation();
          selectNode(p.data.id);
          if (p.data.id !== currentFocusId || !p.children) focusOn(p.data.id);
        })
        .on("contextmenu", (event, p) => {
          event.preventDefault(); event.stopPropagation();
          selectNode(p.data.id);
          showContextMenu(event.pageX, event.pageY, p.data.id);
        });

      labelGroup = cameraGroup.append("g").attr("pointer-events", "none");
      path.each(d => d.current = d);

      const targetNode = findD3Node(currentFocusId) || root;
      updateChartState(targetNode, false);
      updateUI();
    }

    // STRICT 2-RING LIMIT: Only render sectors where y1 <= 3 (Center disc = Level 0, Ring 1 = Level 1, Ring 2 = Level 2)
    function isVisible(d) { return d.y1 <= 3 && d.y0 >= 1 && d.x1 > d.x0; }

    function updateChartState(p, animate = true) {
      currentFocusId = p.data.id;

      svg.select(".center-title").text(p.data.name.length > 18 ? p.data.name.slice(0, 17) + '…' : p.data.name);
      svg.select(".center-val").text(p.value || 0);
      svg.select(".center-sub").text(p.depth === 0 ? `root • ${p.children ? p.children.length : 0} topics` : "▲ click disc to zoom out");

      const t = cameraGroup.transition().duration(animate ? 700 : 0).ease(d3.easeCubicOut);

      root.each(d => {
        d.target = {
          x0: Math.max(0, Math.min(1, (d.x0 - p.x0) / (p.x1 - p.x0))) * 2 * Math.PI,
          x1: Math.max(0, Math.min(1, (d.x1 - p.x0) / (p.x1 - p.x0))) * 2 * Math.PI,
          y0: Math.max(0, d.y0 - p.depth),
          y1: Math.max(0, d.y1 - p.depth)
        };
      });

      path.transition(t)
        .tween("data", d => {
          const i = d3.interpolate(d.current, d.target);
          return t => d.current = i(t);
        })
        .filter(function(d) { return +this.getAttribute("fill-opacity") || isVisible(d.target); })
        .attr("fill-opacity", d => isVisible(d.target) ? 0.95 : 0)
        .attr("pointer-events", d => isVisible(d.target) ? "auto" : "none")
        .attrTween("d", d => () => arc(d.current));

      // Filter visible nodes that have enough angular width for text
      const visibleNodes = root.descendants().slice(1).filter(d => isVisible(d.target) && (d.target.x1 - d.target.x0) > 0.12);

      // Update SVG arc paths in <defs> so text wraps along curves
      labelDefs.selectAll("path")
        .data(visibleNodes, d => d.data.id)
        .join("path")
        .attr("id", d => `textPath-${d.data.id}`)
        .transition(t)
        .attrTween("d", d => () => getMiddleArcPath(d));

      const labels = labelGroup.selectAll("text")
        .data(visibleNodes, d => d.data.id)
        .join("text")
        .attr("class", "fill-white font-semibold text-[11px] drop-shadow-[0_1px_2px_rgba(0,0,0,0.95)] transition-opacity duration-300")
        .style("opacity", animate ? 0 : 1);

      labels.selectAll("textPath")
        .data(d => [d])
        .join("textPath")
        .attr("href", d => `#textPath-${d.data.id}`)
        .attr("startOffset", "50%")
        .attr("text-anchor", "middle")
        .text(d => {
          const ang = d.target.x1 - d.target.x0;
          const r = (d.target.y0 + d.target.y1) / 2 * radius;
          const arcLen = r * ang;
          // Calculate max character capacity along this physical arc
          const maxChars = Math.floor(arcLen / 6.3);
          let fullStr = `${d.data.name} (${d.value || 0})`;

          if (fullStr.length > maxChars) {
            if (d.data.name.length > maxChars) {
              return d.data.name.slice(0, Math.max(2, maxChars - 1)) + '…';
            }
            return d.data.name; // Fit category name without numeric value if needed
          }
          return fullStr;
        });

      if (animate) labels.transition().delay(350).duration(250).style("opacity", 1);
    }

    function focusOn(id) {
      const target = findD3Node(id);
      if (target) {
        updateChartState(target, true);
        selectNode(id);
      }
    }

    function selectNode(id) {
      selectedNodeId = id;
      updateUI();
    }

    // --- 6. PRO INSPECTOR & RENAMING ENGINE ---
    function updateUI() {
      const d3Focus = findD3Node(currentFocusId) || root;
      const d3Selected = findD3Node(selectedNodeId) || d3Focus;
      const rawNode = findRawNode(treeData, selectedNodeId) || treeData;

      document.getElementById("sidebar-depth-label").innerText = d3Selected.depth === 0 ? "Root Overview" : `Level ${d3Selected.depth} • ${d3Selected.parent.data.name}`;
      document.getElementById("sidebar-title").innerText = rawNode.name;

      const totalEl = document.getElementById("sidebar-total");
      if (totalEl.innerText !== String(d3Selected.value || 0)) {
        totalEl.classList.remove("animate-odo");
        void totalEl.offsetWidth;
        totalEl.innerText = d3Selected.value || 0;
        totalEl.classList.add("animate-odo");
      }

      const parentVal = d3Selected.parent ? d3Selected.parent.value : d3Selected.value;
      const shareParent = parentVal > 0 ? ((d3Selected.value / parentVal) * 100).toFixed(1) : "100";
      const shareTotal = root.value > 0 ? ((d3Selected.value / root.value) * 100).toFixed(1) : "100";

      document.getElementById("sidebar-progress-bar").style.width = `${shareParent}%`;
      document.getElementById("sidebar-share-parent").innerText = d3Selected.depth === 0 ? "100% of parent" : `${shareParent}% of parent (${d3Selected.parent.data.name})`;
      document.getElementById("sidebar-share-total").innerText = `${shareTotal}% of total`;

      const bcEl = document.getElementById("breadcrumbs");
      bcEl.innerHTML = "";
      d3Selected.ancestors().reverse().forEach((anc, i, arr) => {
        const btn = document.createElement("button");
        btn.className = `hover:text-accent font-medium flex items-center gap-1 transition ${anc.data.id === selectedNodeId ? 'text-white underline font-bold decoration-accent decoration-2' : 'text-gray-400'}`;
        btn.innerText = anc.data.name;
        btn.onclick = () => focusOn(anc.data.id);
        bcEl.appendChild(btn);

        if (i < arr.length - 1) {
          const sep = document.createElement("span");
          sep.className = "text-gray-600 text-[10px] px-0.5";
          sep.innerText = "/>";
          bcEl.appendChild(sep);
        }
      });

      const container = document.getElementById("children-container");
      container.innerHTML = "";
      const children = rawNode.children || [];
      document.getElementById("child-count").innerText = children.length;

      if (children.length === 0) {
        container.innerHTML = `
          <div class="text-center py-10 border border-dashed border-borderDark rounded-xl text-gray-500 bg-black/20">
            <p class="text-xs">No children in this branch.</p>
          </div>`;
      } else {
        children.forEach((child, idx) => {
          const el = document.createElement("div");
          el.className = "group bg-panel border border-borderDark hover:border-gray-500/80 rounded-xl p-3 flex items-center justify-between gap-3 shadow-md transition cursor-pointer select-none relative overflow-hidden";
          el.draggable = true;

          el.ondragstart = (e) => {
            e.dataTransfer.setData("text/plain", JSON.stringify({ parentId: rawNode.id, index: idx }));
            el.classList.add("opacity-40");
          };
          el.ondragend = () => el.classList.remove("opacity-40");
          el.ondragover = (e) => { e.preventDefault(); el.classList.add("border-accent"); };
          el.ondragleave = () => el.classList.remove("border-accent");
          el.ondrop = (e) => {
            e.preventDefault();
            el.classList.remove("border-accent");
            const data = JSON.parse(e.dataTransfer.getData("text/plain"));
            if (data.parentId === rawNode.id && data.index !== idx) {
              const [moved] = rawNode.children.splice(data.index, 1);
              rawNode.children.splice(idx, 0, moved);
              saveState(); renderSunburst();
            }
          };

          el.onclick = () => focusOn(child.id);

          const isLeaf = !child.children || child.children.length === 0;
          const childD3 = findD3Node(child.id);
          const displayVal = childD3 ? childD3.value : (child.value || 0);

          el.innerHTML = `
            <div class="flex items-center gap-2.5 flex-1 overflow-hidden">
              <span class="text-gray-600 group-hover:text-gray-400 cursor-grab text-[10px]" title="Drag to reorder">⠿</span>
              <div class="flex-1 overflow-hidden">
                <div class="text-xs font-semibold text-gray-200 group-hover:text-white truncate transition">${child.name}</div>
                <div class="text-[10px] text-gray-400 font-mono flex items-center gap-2">
                  <span>val: <strong class="text-white">${displayVal}</strong></span>
                  ${!isLeaf ? `<span class="bg-white/10 px-1 rounded text-[9px] text-gray-300">${child.children.length} sub</span>` : ''}
                </div>
              </div>
            </div>

            <div class="flex items-center gap-1 opacity-90 group-hover:opacity-100 transition" onclick="event.stopPropagation()">
              <button onclick="quickInc('${child.id}', -1)" title="Hold to repeat" class="w-6 h-6 rounded-md bg-black/40 hover:bg-white/15 border border-borderDark flex items-center justify-center text-xs font-mono text-gray-300 active:scale-90 transition font-bold">-</button>
              <button onclick="quickInc('${child.id}', 1)" title="Hold to repeat" class="w-6 h-6 rounded-md bg-black/40 hover:bg-white/15 border border-borderDark flex items-center justify-center text-xs font-mono text-gray-300 active:scale-90 transition font-bold">+</button>

              <div class="relative ml-1">
                <button onclick="showInlineMenu(event, '${child.id}')" class="p-1 text-gray-500 hover:text-white rounded">⋮</button>
              </div>
            </div>
          `;

          const btns = el.querySelectorAll("button[title='Hold to repeat']");
          setupHoldToRepeat(btns[0], () => quickInc(child.id, -1));
          setupHoldToRepeat(btns[1], () => quickInc(child.id, 1));

          container.appendChild(el);
        });
      }
    }

    function setupHoldToRepeat(btn, actionFn) {
      let timer, delay = 300, interval = 150;
      const start = (e) => {
        if (e.button !== 0) return;
        actionFn();
        timer = setTimeout(function repeat() {
          actionFn();
          if (interval > 30) interval = Math.floor(interval * 0.88);
          timer = setTimeout(repeat, interval);
        }, delay);
      };
      const stop = () => { clearTimeout(timer); delay = 300; interval = 150; };
      btn.addEventListener('mousedown', start);
      window.addEventListener('mouseup', stop);
      btn.addEventListener('mouseleave', stop);
    }

    function quickInc(id, delta) {
      const node = findRawNode(treeData, id);
      if (!node) return;
      if (node.children && node.children.length > 0) {
        alert("Cannot increment a parent branch directly. Modify its sub-sections!");
        return;
      }
      node.value = Math.max(0, (Number(node.value) || 0) + delta);

      const d3Node = findD3Node(id);
      if (d3Node) {
        d3Node.ancestors().forEach(anc => {
          const arcEl = document.getElementById(`arc-${anc.data.id}`);
          if (arcEl) {
            arcEl.classList.remove("parent-pulse");
            void arcEl.offsetWidth;
            arcEl.classList.add("parent-pulse");
          }
        });
      }

      saveState(); renderSunburst();
    }

    function renameCurrentNode() {
      const target = findRawNode(treeData, selectedNodeId);
      if (!target) return;
      const newName = prompt("Rename section:", target.name);
      if (newName !== null && newName.trim() !== "") {
        target.name = newName.trim();
        saveState(); renderSunburst();
      }
    }

    // --- 7. SIDEBAR INLINE SEARCH ---
    let searchHighlightTimer = null;
    function toggleSidebarSearch() {
      const box = document.getElementById("sidebar-search-box");
      const input = document.getElementById("sidebar-search-input");
      box.classList.toggle("hidden");
      if (!box.classList.contains("hidden")) {
        box.classList.add("flex");
        input.value = "";
        input.focus();
        filterSidebarSearch("");
      } else {
        box.classList.remove("flex");
        svg.selectAll("path.sector").classed("search-highlight", false);
      }
    }

    document.getElementById("sidebar-search-input").addEventListener("input", (e) => {
      filterSidebarSearch(e.target.value);
    });

    function filterSidebarSearch(query) {
      const resultsContainer = document.getElementById("sidebar-search-results");
      resultsContainer.innerHTML = "";
      const q = query.toLowerCase().trim();
      if (!q) return;

      const allNodes = [];
      root.each(d => allNodes.push(d));
      const matches = allNodes.filter(d => d.data.name.toLowerCase().includes(q));

      if (matches.length === 0) {
        resultsContainer.innerHTML = `<div class="p-2 text-gray-500 text-center">No matching sections found.</div>`;
        return;
      }

      matches.slice(0, 10).forEach(d => {
        const el = document.createElement("div");
        el.className = "p-2 hover:bg-white/10 rounded-lg flex items-center justify-between cursor-pointer transition";
        el.innerHTML = `
          <div class="truncate">
            <span class="text-white font-medium">${d.data.name}</span>
            <span class="text-[10px] text-gray-400 font-mono ml-1.5">val: ${d.value || 0}</span>
          </div>
          <span class="text-[9px] bg-black/40 px-1.5 py-0.5 rounded text-gray-400 font-mono">Lvl ${d.depth}</span>
        `;
        el.onclick = () => {
          focusOn(d.data.id);
          svg.selectAll("path.sector").classed("search-highlight", false);
          const targetArc = document.getElementById(`arc-${d.data.id}`);
          if (targetArc) {
            targetArc.classList.add("search-highlight");
            clearTimeout(searchHighlightTimer);
            searchHighlightTimer = setTimeout(() => targetArc.classList.remove("search-highlight"), 2500);
          }
        };
        resultsContainer.appendChild(el);
      });
    }

    // --- 8. NODE HELPER ALGORITHMS ---
    function findD3Node(id) {
      if (!root) return null;
      return root.descendants().find(d => d.data.id === id);
    }

    function findRawNode(curr, id) {
      if (curr.id === id) return curr;
      if (curr.children) {
        for (let c of curr.children) {
          const res = findRawNode(c, id);
          if (res) return res;
        }
      }
      return null;
    }

    function findParentRaw(curr, id) {
      if (!curr.children) return null;
      for (let c of curr.children) {
        if (c.id === id) return curr;
        const res = findParentRaw(c, id);
        if (res) return res;
      }
      return null;
    }

    function handleCreateChild(e) {
      e.preventDefault();
      const parent = findRawNode(treeData, selectedNodeId);
      if (!parent) return;

      const name = document.getElementById("new-child-name").value.trim();
      const val = parseFloat(document.getElementById("new-child-val").value) || 0;

      if (!parent.children) parent.children = [];
      const newId = "node_" + Math.random().toString(36).substr(2, 7);
      parent.children.push({ id: newId, name, value: val });

      document.getElementById("new-child-name").value = "";
      saveState(); renderSunburst();
      focusOn(selectedNodeId);
    }

    function showContextMenu(x, y, id) {
      ctxTargetId = id;
      const menu = document.getElementById("context-menu");
      menu.style.left = `${Math.min(x, window.innerWidth - 200)}px`;
      menu.style.top = `${Math.min(y, window.innerHeight - 150)}px`;
      menu.classList.remove("hidden");
    }

    function showInlineMenu(event, id) {
      event.stopPropagation();
      showContextMenu(event.pageX - 140, event.pageY + 15, id);
    }

    function ctxAction(type) {
      document.getElementById("context-menu").classList.add("hidden");
      if (!ctxTargetId) return;
      const target = findRawNode(treeData, ctxTargetId);
      if (!target) return;

      if (type === 'add') {
        selectNode(ctxTargetId);
        document.getElementById("new-child-name").focus();
      } else if (type === 'rename') {
        selectNode(ctxTargetId);
        renameCurrentNode();
      } else if (type === 'duplicate') {
        const parent = findParentRaw(treeData, ctxTargetId);
        if (parent && parent.children) {
          const clone = JSON.parse(JSON.stringify(target));
          clone.id = "node_" + Math.random().toString(36).substr(2, 7);
          clone.name = clone.name + " (Copy)";
          parent.children.push(clone);
          saveState(); renderSunburst();
        }
      } else if (type === 'delete') {
        if (ctxTargetId === 'root') { alert("Cannot delete the Root node!"); return; }
        if (confirm(`Delete branch "${target.name}" and all sub-sections?`)) {
          const parent = findParentRaw(treeData, ctxTargetId);
          if (parent) {
            parent.children = parent.children.filter(c => c.id !== ctxTargetId);
            if (selectedNodeId === ctxTargetId) selectedNodeId = parent.id;
            if (currentFocusId === ctxTargetId) currentFocusId = parent.id;
            saveState(); renderSunburst();
          }
        }
      }
    }

    function exportJSON() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(treeData, null, 2));
      const dl = document.createElement('a');
      dl.setAttribute("href", dataStr);
      dl.setAttribute("download", `BaobabPro_${new Date().toISOString().slice(0,10)}.json`);
      dl.click();
    }

    // --- 9. EVENT LISTENERS & INIT ---
    window.addEventListener("click", () => {
      document.getElementById("context-menu").classList.add("hidden");
    });

    window.addEventListener("keydown", (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
        e.preventDefault();
        if (e.shiftKey) redo(); else undo();
      }
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') {
        e.preventDefault();
        redo();
      }
      if (e.key === 'Escape') {
        document.getElementById("context-menu").classList.add("hidden");
      }
    });

    window.addEventListener("resize", () => renderSunburst());

    initDB().then(() => {
      if (dbInstance) {
        const tx = dbInstance.transaction(STORE_NAME, 'readonly');
        const req = tx.objectStore(STORE_NAME).get('rootTree');
        req.onsuccess = () => {
          if (req.result) treeData = req.result;
          else if (localStorage.getItem('BaobabV2_tree')) treeData = JSON.parse(localStorage.getItem('BaobabV2_tree'));
          renderSunburst();
        };
      } else {
        if (localStorage.getItem('BaobabV2_tree')) treeData = JSON.parse(localStorage.getItem('BaobabV2_tree'));
        renderSunburst();
      }
    });
  </script>
</body>
</html>
