<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Baobab — Hierarchical Progress Map</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            canvas: '#0a0a0c',
            panel: '#121216',
            borderDark: '#22222b',
            accent: '#3b82f6',
          },
          boxShadow: {
            'glass': '0 8px 32px 0 rgba(0, 0, 0, 0.37)',
            'glow': '0 0 20px -5px var(--tw-shadow-color)',
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

    * { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2a2a35; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #3e3e4f; }

    /* Spring Animation for Number Increments */
    @keyframes bounce-scale {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.18); color: #60a5fa; }
    }
    .animate-bounce-short { animation: bounce-scale 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

    /* D3 Arc Hover & Focus Transitions */
    path.sector { transition: filter 0.2s ease, opacity 0.2s ease; cursor: pointer; }
    path.sector:hover { filter: brightness(1.2) drop-shadow(0 0 8px rgba(255,255,255,0.15)); }
    path.sector.selected { stroke: #ffffff !important; stroke-width: 2.5px !important; filter: brightness(1.25); }

    .glass-panel {
      background: rgba(18, 18, 22, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
  </style>
</head>
<body class="bg-canvas text-gray-100 flex h-screen w-screen overflow-hidden select-none">

  <!-- TOP BAR: Breadcrumbs & Search -->
  <div class="absolute top-0 left-0 right-96 h-16 z-10 flex items-center justify-between px-6 pointer-events-none">
    <!-- Breadcrumbs -->
    <div id="breadcrumbs" class="flex items-center gap-1.5 bg-panel/90 border border-borderDark px-3.5 py-1.5 rounded-full shadow-lg backdrop-blur-md pointer-events-auto text-sm font-medium">
      <!-- Populated dynamically -->
    </div>

    <!-- Search Bar -->
    <div class="relative pointer-events-auto w-64">
      <input type="text" id="search-input" placeholder="Search progress (e.g. alg)..."
        class="w-full bg-panel/90 border border-borderDark rounded-full px-4 py-1.5 text-xs text-gray-200 placeholder-gray-500 focus:outline-none focus:border-accent focus:ring-1 focus:ring-accent transition-all shadow-lg backdrop-blur-md">
      <div id="search-results" class="absolute right-0 mt-2 w-72 bg-panel border border-borderDark rounded-xl shadow-2xl overflow-hidden hidden z-50 max-h-64 overflow-y-auto divide-y divide-borderDark/50"></div>
    </div>
  </div>

  <!-- CENTER: D3 Zoomable Sunburst Canvas -->
  <div class="flex-1 h-full relative flex items-center justify-center" id="canvas-container">
    <div id="chart" class="w-full h-full flex items-center justify-center"></div>

    <!-- Keyboard Hint Pill -->
    <div class="absolute bottom-6 left-6 bg-panel/60 border border-borderDark/60 px-3 py-1 rounded-md text-[11px] text-gray-400 pointer-events-none backdrop-blur-sm flex items-center gap-3">
      <span><kbd class="bg-white/10 px-1 rounded text-gray-300">↑↓</kbd> Nav</span>
      <span><kbd class="bg-white/10 px-1 rounded text-gray-300">Space</kbd> / <kbd class="bg-white/10 px-1 rounded text-gray-300">+</kbd> Inc</span>
      <span><kbd class="bg-white/10 px-1 rounded text-gray-300">Enter</kbd> Drill</span>
      <span><kbd class="bg-white/10 px-1 rounded text-gray-300">Right-Click</kbd> Menu</span>
    </div>
  </div>

  <!-- RIGHT SIDEBAR: Inspector & Controls -->
  <div class="w-96 h-full glass-panel border-l border-borderDark flex flex-col z-20 shadow-2xl">

    <!-- Header Node Info -->
    <div class="p-6 border-b border-borderDark">
      <div class="text-xs font-semibold uppercase tracking-wider text-accent mb-1" id="sidebar-depth-label">Root Level</div>
      <div class="flex items-baseline justify-between">
        <h1 class="text-2xl font-bold text-white tracking-tight truncate flex-1" id="sidebar-title">Entire Life</h1>
        <div class="text-3xl font-extrabold text-white font-mono tracking-tight ml-2" id="sidebar-total">0</div>
      </div>
    </div>

    <!-- Stats Drawer Toggle / Bar -->
    <div class="bg-white/[0.02] border-b border-borderDark px-6 py-2.5 flex items-center justify-between text-xs text-gray-400">
      <span>Branches: <strong class="text-gray-200" id="stat-cats">0</strong></span>
      <span>Deepest: <strong class="text-gray-200" id="stat-depth">0</strong></span>
      <span>Avg Leaf: <strong class="text-gray-200" id="stat-avg">0</strong></span>
    </div>

    <!-- Children / Subsections List -->
    <div class="flex-1 overflow-y-auto p-6 space-y-2.5" id="children-container">
      <!-- Dynamic cards rendered here -->
    </div>

    <!-- Footer: Quick Add Section -->
    <div class="p-5 border-t border-borderDark bg-black/20">
      <div class="text-xs font-medium text-gray-400 mb-2 flex justify-between items-center">
        <span>Append to Current Section</span>
        <span class="text-[10px] text-gray-500">Auto-saves to IndexedDB</span>
      </div>
      <form id="add-form" class="flex gap-2" onsubmit="handleCreateChild(event)">
        <input type="text" id="new-child-name" placeholder="Name (e.g. Physics)" required
          class="flex-1 bg-black/40 border border-borderDark rounded-lg px-3 py-2 text-xs text-white placeholder-gray-500 focus:outline-none focus:border-accent transition">
        <input type="number" id="new-child-val" placeholder="Val" value="10" min="0"
          class="w-16 bg-black/40 border border-borderDark rounded-lg px-2 py-2 text-xs text-white text-center font-mono focus:outline-none focus:border-accent transition">
        <button type="submit"
          class="bg-accent hover:bg-blue-600 active:scale-95 text-white text-xs font-semibold px-3.5 py-2 rounded-lg transition shadow-glow shadow-accent/20">
          + Add
        </button>
      </form>
    </div>
  </div>

  <!-- RIGHT CLICK CONTEXT MENU -->
  <div id="context-menu" class="absolute hidden z-50 w-44 bg-panel/95 border border-borderDark rounded-xl shadow-2xl backdrop-blur-xl py-1.5 text-xs divide-y divide-borderDark/50">
    <div class="py-1">
      <button onclick="ctxAction('add')" class="w-full px-4 py-2 text-left hover:bg-white/10 flex items-center gap-2 text-gray-200">
        <span class="text-accent">+</span> Add Child Sub-section
      </button>
      <button onclick="ctxAction('rename')" class="w-full px-4 py-2 text-left hover:bg-white/10 flex items-center gap-2 text-gray-200">
        <span>✎</span> Rename Section
      </button>
    </div>
    <div class="py-1">
      <button onclick="ctxAction('duplicate')" class="w-full px-4 py-2 text-left hover:bg-white/10 flex items-center gap-2 text-gray-200">
        <span>⧉</span> Duplicate Branch
      </button>
    </div>
    <div class="py-1">
      <button onclick="ctxAction('delete')" class="w-full px-4 py-2 text-left hover:bg-red-500/20 text-red-400 flex items-center gap-2">
        <span>✕</span> Delete Section
      </button>
    </div>
  </div>

  <!-- JAVASCRIPT ENGINE -->
  <script>
    // --- 1. PERSISTENCE ENGINE (IndexedDB + LocalStorage Fallback) ---
    const DB_NAME = 'BaobabProgressDB';
    const STORE_NAME = 'treeStore';
    let dbInstance = null;

    function initDB() {
      return new Promise((resolve) => {
        const request = indexedDB.open(DB_NAME, 1);
        request.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            db.createObjectStore(STORE_NAME);
          }
        };
        request.onsuccess = (e) => { dbInstance = e.target.result; resolve(true); };
        request.onerror = () => { console.warn("IndexedDB blocked, falling back to localStorage"); resolve(false); };
      });
    }

    async function saveTreeToDB() {
      if (dbInstance) {
        const tx = dbInstance.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).put(treeData, 'rootTree');
      } else {
        localStorage.setItem('baobab_tree_data', JSON.stringify(treeData));
      }
    }

    async function loadTreeFromDB() {
      if (dbInstance) {
        return new Promise((resolve) => {
          const tx = dbInstance.transaction(STORE_NAME, 'readonly');
          const req = tx.objectStore(STORE_NAME).get('rootTree');
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => resolve(null);
        });
      }
      const local = localStorage.getItem('baobab_tree_data');
      return local ? JSON.parse(local) : null;
    }

    // --- 2. DEFAULT TREE DATASET ---
    const defaultData = {
      id: "root", name: "Entire Life", color: "#6366f1",
      children: [
        {
          id: "learning", name: "Learning", color: "#3b82f6", // Blue
          children: [
            {
              id: "math", name: "Math", children: [
                { id: "alg", name: "Algebra", value: 34 },
                { id: "geo", name: "Geometry", value: 12 },
                { id: "calc", name: "Calculus", value: 7 }
              ]
            },
            {
              id: "prog", name: "Programming", children: [
                { id: "py", name: "Python", value: 84 },
                { id: "godot", name: "Godot Engine", value: 25 },
                { id: "algo", name: "Algorithms", value: 11 }
              ]
            },
            {
              id: "lang", name: "Languages", children: [
                { id: "amh", name: "Amharic", value: 16 },
                { id: "jap", name: "Japanese", value: 2 }
              ]
            }
          ]
        },
        {
          id: "fitness", name: "Fitness", color: "#10b981", // Green
          children: [
            { id: "upper", name: "Upper Body Split", value: 18 },
            { id: "lower", name: "Lower Body Split", value: 14 },
            { id: "cardio", name: "Conditioning", value: 8 }
          ]
        },
        {
          id: "projects", name: "Projects", color: "#8b5cf6", // Purple
          children: [
            { id: "led", name: "LED Physics Website", value: 45 },
            { id: "paper", name: "Python Academic Paper", value: 30 },
            { id: "linux", name: "Linux System Setup", value: 15 }
          ]
        }
      ]
    };

    let treeData = defaultData;
    let currentFocusId = "root";
    let selectedNodeId = "root"; // For keyboard navigation & context menu
    let ctxTargetId = null;

    // --- 3. COLOR PALETTE GENERATOR ---
    const baseHues = ["#3b82f6", "#10b981", "#8b5cf6", "#f59e0b", "#ec4899", "#06b6d4", "#ef4444"];
    function getSectorColor(d) {
      if (d.depth === 0) return "#1e1e24";
      // Find top-level ancestor
      let ancestor = d;
      while (ancestor.depth > 1) ancestor = ancestor.parent;

      let base = ancestor.data.color;
      if (!base) {
        const idx = ancestor.parent.children.indexOf(ancestor);
        base = baseHues[idx % baseHues.length];
        ancestor.data.color = base; // Cache it
      }

      // Generate monochrome shade based on depth and sibling index
      const c = d3.hsl(base);
      const siblingIdx = d.parent ? d.parent.children.indexOf(d) : 0;
      c.s = Math.max(0.3, c.s - (d.depth - 1) * 0.12);
      c.l = Math.max(0.25, Math.min(0.75, c.l + (siblingIdx * 0.08) - ((d.depth - 1) * 0.06)));
      return c.toString();
    }

    // --- 4. D3 SUNBURST ENGINE ---
    const container = document.getElementById('canvas-container');
    let width = Math.min(container.clientWidth, container.clientHeight) * 0.92;
    let radius = width / 6;

    const svg = d3.select("#chart").append("svg")
      .attr("viewBox", `-${width / 2} -${width / 2} ${width} ${width}`)
      .attr("class", "w-full h-full max-w-4xl max-h-4xl drop-shadow-2xl");

    const arc = d3.arc()
      .startAngle(d => d.x0)
      .endAngle(d => d.x1)
      .padAngle(d => Math.min((d.x1 - d.x0) / 2, 0.006))
      .padRadius(radius * 1.5)
      .innerRadius(d => d.y0 * radius)
      .outerRadius(d => Math.max(d.y0 * radius, d.y1 * radius - 2));

    let root, path, labelGroup;

    function renderSunburst() {
      svg.selectAll("*").remove();
      width = Math.min(container.clientWidth, container.clientHeight) * 0.92;
      radius = width / 6;
      svg.attr("viewBox", `-${width / 2} -${width / 2} ${width} ${width}`);

      root = d3.hierarchy(treeData)
        .sum(d => (!d.children || d.children.length === 0) ? (Number(d.value) || 0) : 0)
        .sort((a, b) => b.value - a.value);

      d3.partition().size([2 * Math.PI, root.height + 1])(root);

      // Center Disc Hitbox & Labels
      const centerGroup = svg.append("g").attr("class", "center-group");
      centerGroup.append("circle")
        .attr("r", radius * 0.95)
        .attr("fill", "#121216")
        .attr("stroke", "#22222b")
        .attr("stroke-width", 2)
        .attr("class", "cursor-pointer transition hover:fill-[#1a1a20]")
        .on("click", () => {
          const current = findD3Node(currentFocusId);
          if (current && current.parent) focusOn(current.parent.data.id);
        });

      centerGroup.append("text").attr("class", "center-title text-base font-bold fill-white text-anchor-middle").attr("text-anchor", "middle").attr("dy", "-0.3em");
      centerGroup.append("text").attr("class", "center-val text-xs font-mono fill-gray-400 text-anchor-middle").attr("text-anchor", "middle").attr("dy", "1.2em");
      centerGroup.append("text").attr("class", "center-sub text-[9px] uppercase tracking-widest fill-blue-400 text-anchor-middle").attr("text-anchor", "middle").attr("dy", "2.8em");

      // Draw Sector Arcs
      path = svg.append("g")
        .selectAll("path")
        .data(root.descendants().slice(1))
        .join("path")
        .attr("class", d => `sector ${d.data.id === selectedNodeId ? 'selected' : ''}`)
        .attr("fill", d => getSectorColor(d))
        .attr("stroke", "#0a0a0c")
        .attr("stroke-width", 1.5)
        .attr("d", d => arc(d.current || d))
        .on("click", (event, p) => {
          event.stopPropagation();
          selectNode(p.data.id);
          if (p.data.id === currentFocusId && p.children) {
            // Already focused, don't re-zoom
          } else {
            focusOn(p.data.id);
          }
        })
        .on("contextmenu", (event, p) => {
          event.preventDefault();
          event.stopPropagation();
          selectNode(p.data.id);
          showContextMenu(event.pageX, event.pageY, p.data.id);
        });

      // Text Labels on Arcs
      labelGroup = svg.append("g").attr("pointer-events", "none").attr("text-anchor", "middle");

      path.each(d => d.current = d);

      const targetNode = findD3Node(currentFocusId) || root;
      updateChartState(targetNode, false);
      updateUI();
    }

    function isVisible(d) {
      return d.y1 <= 4 && d.y0 >= 1 && d.x1 > d.x0;
    }

    function updateChartState(p, animate = true) {
      currentFocusId = p.data.id;

      // Update Center Disc Text
      svg.select(".center-title").text(p.data.name.length > 14 ? p.data.name.slice(0, 13) + '…' : p.data.name);
      svg.select(".center-val").text(`${p.value || 0} TOTAL`);
      svg.select(".center-sub").text(p.depth === 0 ? "CLICK ARC TO DRILL" : "▲ CLICK TO ZOOM OUT");

      const t = svg.transition().duration(animate ? 650 : 0).ease(d3.easeCubicOut);

      root.each(d => {
        d.target = {
          x0: Math.max(0, Math.min(1, (d.x0 - p.x0) / (p.x1 - p.x0))) * 2 * Math.PI,
          x1: Math.max(0, Math.min(1, (d.x1 - p.x0) / (p.x1 - p.x0))) * 2 * Math.PI,
          y0: Math.max(0, d.y0 - p.depth),
          y1: Math.max(0, d.y1 - p.depth)
        };
      });

      path.transition(t)
        .tween("data", d => {
          const i = d3.interpolate(d.current, d.target);
          return t => d.current = i(t);
        })
        .filter(function(d) {
          return +this.getAttribute("fill-opacity") || isVisible(d.target);
        })
        .attr("fill-opacity", d => isVisible(d.target) ? 0.9 : 0)
        .attr("pointer-events", d => isVisible(d.target) ? "auto" : "none")
        .attrTween("d", d => () => arc(d.current));

      // Refresh Labels dynamically based on sector width
      labelGroup.selectAll("text").remove();
      const visibleNodes = root.descendants().slice(1).filter(d => isVisible(d.target) && (d.target.x1 - d.target.x0) > 0.12);

      const labels = labelGroup.selectAll("text")
        .data(visibleNodes)
        .join("text")
        .attr("class", "fill-white font-medium text-[11px] drop-shadow-md transition-opacity duration-300")
        .style("opacity", animate ? 0 : 1)
        .attr("transform", d => {
          const x = (d.target.x0 + d.target.x1) / 2 * 180 / Math.PI;
          const y = (d.target.y0 + d.target.y1) / 2 * radius;
          return `rotate(${x - 90}) translate(${y},0) rotate(${x < 180 ? 0 : 180})`;
        })
        .attr("dy", "0.3em")
        .text(d => {
          const angle = d.target.x1 - d.target.x0;
          const name = d.data.name;
          if (angle < 0.25 && name.length > 8) return name.slice(0, 7) + '…';
          return `${name} (${d.value || 0})`;
        });

      if (animate) labels.transition().delay(400).duration(250).style("opacity", 1);
    }

    function focusOn(id) {
      const target = findD3Node(id);
      if (target) {
        updateChartState(target, true);
        updateUI();
      }
    }

    function selectNode(id) {
      selectedNodeId = id;
      svg.selectAll("path.sector").attr("class", d => `sector ${d.data.id === selectedNodeId ? 'selected' : ''}`);
      updateUI();
    }

    // --- 5. UI, SIDEBAR & BREADCRUMBS ---
    function updateUI() {
      const d3Focus = findD3Node(currentFocusId) || root;
      const d3Selected = findD3Node(selectedNodeId) || d3Focus;
      const rawNode = findRawNode(treeData, selectedNodeId) || treeData;

      // Sidebar Header
      document.getElementById("sidebar-depth-label").innerText = d3Selected.depth === 0 ? "Root Directory" : `Level ${d3Selected.depth} • Parent: ${d3Selected.parent ? d3Selected.parent.data.name : 'Root'}`;
      document.getElementById("sidebar-title").innerText = rawNode.name;
      document.getElementById("sidebar-total").innerText = d3Selected.value || 0;

      // Render Breadcrumbs
      const bcContainer = document.getElementById("breadcrumbs");
      bcContainer.innerHTML = "";
      const ancestors = d3Focus.ancestors().reverse();
      ancestors.forEach((anc, idx) => {
        const btn = document.createElement("button");
        btn.className = `hover:text-accent transition flex items-center gap-1 ${idx === ancestors.length - 1 ? 'text-white font-semibold' : 'text-gray-400'}`;
        btn.innerHTML = `<span>${anc.data.name}</span>`;
        btn.onclick = () => focusOn(anc.data.id);
        bcContainer.appendChild(btn);

        if (idx < ancestors.length - 1) {
          const sep = document.createElement("span");
          sep.className = "text-gray-600 select-none";
          sep.innerText = "›";
          bcContainer.appendChild(sep);
        }
      });

      // Render Sub-sections
      const list = document.getElementById("children-container");
      list.innerHTML = "";
      const children = rawNode.children || [];

      if (children.length === 0) {
        // Leaf Node View
        list.innerHTML = `
          <div class="bg-white/[0.03] border border-borderDark rounded-xl p-5 text-center">
            <div class="text-xs text-gray-400 mb-3 font-medium">LEAF NODE PROGRESS</div>
            <div class="flex items-center justify-center gap-4 mb-4">
              <button onmousedown="startHoldDec('${rawNode.id}')" onmouseup="stopHold()" onmouseleave="stopHold()"
                class="w-10 h-10 rounded-lg bg-white/5 hover:bg-white/10 active:scale-90 font-bold text-lg text-gray-300 transition flex items-center justify-center shadow">
                -
              </button>

              <div id="val-display-${rawNode.id}" onclick="enableManualEdit('${rawNode.id}', ${rawNode.value || 0})"
                title="Click to manually edit number"
                class="text-4xl font-mono font-extrabold text-white cursor-pointer px-4 py-1 rounded hover:bg-white/5 transition border border-transparent hover:border-borderDark">
                ${rawNode.value || 0}
              </div>

              <button onmousedown="startHoldInc('${rawNode.id}')" onmouseup="stopHold()" onmouseleave="stopHold()"
                class="w-10 h-10 rounded-lg bg-accent hover:bg-blue-600 active:scale-90 font-bold text-lg text-white transition flex items-center justify-center shadow-glow shadow-accent/20">
                +
              </button>
            </div>
            <div class="text-[11px] text-gray-500">Hold <kbd class="bg-white/10 px-1 rounded text-gray-400">+</kbd> to rapidly increment or click number to type directly.</div>
          </div>
        `;
      } else {
        // Parent Node View
        children.forEach(child => {
          const childD3 = root.descendants().find(d => d.data.id === child.id);
          const val = childD3 ? childD3.value : (child.value || 0);
          const isSelected = child.id === selectedNodeId;

          const card = document.createElement("div");
          card.className = `group bg-white/[0.02] hover:bg-white/[0.05] border ${isSelected ? 'border-accent bg-accent/5' : 'border-borderDark'} rounded-xl p-3.5 flex items-center justify-between transition cursor-pointer`;
          card.onclick = () => selectNode(child.id);
          card.ondblclick = () => focusOn(child.id);
          card.oncontextmenu = (e) => { e.preventDefault(); e.stopPropagation(); selectNode(child.id); showContextMenu(e.pageX, e.pageY, child.id); };

          card.innerHTML = `
            <div class="flex items-center gap-3 overflow-hidden flex-1">
              <div class="w-2.5 h-2.5 rounded-full flex-shrink-0 shadow-sm" style="background-color: ${childD3 ? getSectorColor(childD3) : '#3b82f6'}"></div>
              <div class="truncate">
                <div class="text-xs font-semibold text-gray-200 group-hover:text-white truncate">${child.name}</div>
                <div class="text-[10px] text-gray-500">${child.children && child.children.length > 0 ? child.children.length + ' sub-branches' : 'Leaf node'}</div>
              </div>
            </div>
            <div class="flex items-center gap-2">
              <span id="pill-${child.id}" class="text-xs font-mono font-bold text-gray-300 bg-black/40 px-2.5 py-1 rounded-md border border-borderDark/60">${val}</span>
              <button onclick="event.stopPropagation(); quickInc('${child.id}', 1)" title="Quick +1"
                class="w-7 h-7 rounded-md bg-white/5 hover:bg-accent text-gray-300 hover:text-white active:scale-90 font-bold transition flex items-center justify-center text-xs">
                +
              </button>
            </div>
          `;
          list.appendChild(card);
        });
      }

      updateStatistics();
    }

    function updateStatistics() {
      const all = root.descendants();
      const leaves = all.filter(d => !d.children || d.children.length === 0);
      const totalDepth = d3.max(all, d => d.depth);
      const avg = leaves.length > 0 ? (d3.sum(leaves, d => d.value) / leaves.length).toFixed(1) : 0;

      document.getElementById("stat-cats").innerText = all.length - 1;
      document.getElementById("stat-depth").innerText = totalDepth;
      document.getElementById("stat-avg").innerText = avg;
    }

    // --- 6. INCREMENT, HOLD-TO-REPEAT & MANUAL EDITING ---
    let holdTimer = null;
    let holdSpeed = 200;

    function quickInc(id, amount) {
      const node = findRawNode(treeData, id);
      if (!node) return;
      if (node.children && node.children.length > 0) {
        // If parent, increment its first leaf or ignore
        alert("Parent section totals auto-calculate from their children! Drill down to increment individual items.");
        return;
      }
      node.value = Math.max(0, (Number(node.value) || 0) + amount);
      saveTreeToDB();
      renderSunburst();

      // Trigger bounce animation on UI pill
      const pill = document.getElementById(`pill-${id}`) || document.getElementById(`val-display-${id}`);
      if (pill) {
        pill.classList.remove("animate-bounce-short");
        void pill.offsetWidth; // Trigger reflow
        pill.classList.add("animate-bounce-short");
      }
    }

    function startHoldInc(id) {
      quickInc(id, 1);
      holdSpeed = 200;
      holdTimer = setTimeout(function repeat() {
        quickInc(id, 1);
        holdSpeed = Math.max(30, holdSpeed * 0.85); // Accelerate
        holdTimer = setTimeout(repeat, holdSpeed);
      }, 350);
    }

    function startHoldDec(id) {
      quickInc(id, -1);
      holdSpeed = 200;
      holdTimer = setTimeout(function repeat() {
        quickInc(id, -1);
        holdSpeed = Math.max(30, holdSpeed * 0.85);
        holdTimer = setTimeout(repeat, holdSpeed);
      }, 350);
    }

    function stopHold() {
      if (holdTimer) clearTimeout(holdTimer);
      holdTimer = null;
    }

    function enableManualEdit(id, currentVal) {
      const container = document.getElementById(`val-display-${id}`);
      if (!container) return;

      container.outerHTML = `
        <input type="number" id="edit-input-${id}" value="${currentVal}"
          class="w-32 text-center text-3xl font-mono font-extrabold bg-black/60 border-2 border-accent rounded-lg text-white py-1 focus:outline-none shadow-glow shadow-accent/30"
          onblur="saveManualEdit('${id}', this.value)"
          onkeydown="if(event.key === 'Enter') this.blur();">
      `;
      const inp = document.getElementById(`edit-input-${id}`);
      inp.focus();
      inp.select();
    }

    function saveManualEdit(id, newVal) {
      const node = findRawNode(treeData, id);
      if (node) {
        node.value = Math.max(0, Number(newVal) || 0);
        saveTreeToDB();
        renderSunburst();
      }
    }

    // --- 7. TREE STRUCTURE MUTATIONS & CONTEXT MENU ---
    function handleCreateChild(e) {
      e.preventDefault();
      const nameInp = document.getElementById("new-child-name");
      const valInp = document.getElementById("new-child-val");
      const name = nameInp.value.trim();
      const val = Math.max(0, Number(valInp.value) || 0);

      if (!name) return;
      const parent = findRawNode(treeData, selectedNodeId) || treeData;

      if (!parent.children) {
        parent.children = [];
        delete parent.value; // Convert leaf to parent branch
      }

      parent.children.push({
        id: "node_" + Date.now() + "_" + Math.random().toString(36).substr(2, 3),
        name: name,
        value: val
      });

      nameInp.value = "";
      valInp.value = "10";
      saveTreeToDB();
      renderSunburst();
    }

    const menu = document.getElementById("context-menu");
    function showContextMenu(x, y, id) {
      ctxTargetId = id;
      menu.style.left = `${Math.min(x, window.innerWidth - 180)}px`;
      menu.style.top = `${Math.min(y, window.innerHeight - 150)}px`;
      menu.classList.remove("hidden");
    }

    document.addEventListener("click", () => menu.classList.add("hidden"));

    function ctxAction(action) {
      menu.classList.add("hidden");
      const id = ctxTargetId || selectedNodeId;
      if (id === "root" && action !== "add") {
        alert("Cannot modify Root directory directly!");
        return;
      }

      if (action === 'delete') {
        if (!confirm("Delete this section and all nested sub-branches?")) return;
        deleteNodeRecursive(treeData, id);
      } else if (action === 'rename') {
        const node = findRawNode(treeData, id);
        const newName = prompt("Enter new section name:", node.name);
        if (newName && newName.trim()) node.name = newName.trim();
      } else if (action === 'add') {
        const node = findRawNode(treeData, id);
        const childName = prompt(`Add sub-section inside "${node.name}":`, "New Goal");
        if (childName && childName.trim()) {
          if (!node.children) { node.children = []; delete node.value; }
          node.children.push({ id: "node_" + Date.now(), name: childName.trim(), value: 10 });
        }
      } else if (action === 'duplicate') {
        duplicateNodeRecursive(treeData, id);
      }

      saveTreeToDB();
      renderSunburst();
    }

    function deleteNodeRecursive(parent, targetId) {
      if (!parent.children) return false;
      const idx = parent.children.findIndex(c => c.id === targetId);
      if (idx !== -1) {
        parent.children.splice(idx, 1);
        if (selectedNodeId === targetId) selectedNodeId = parent.id;
        return true;
      }
      for (let c of parent.children) {
        if (deleteNodeRecursive(c, targetId)) return true;
      }
      return false;
    }

    function duplicateNodeRecursive(parent, targetId) {
      if (!parent.children) return false;
      const idx = parent.children.findIndex(c => c.id === targetId);
      if (idx !== -1) {
        const clone = JSON.parse(JSON.stringify(parent.children[idx]));
        clone.id = "node_" + Date.now();
        clone.name += " (Copy)";
        parent.children.splice(idx + 1, 0, clone);
        return true;
      }
      for (let c of parent.children) {
        if (duplicateNodeRecursive(c, targetId)) return true;
      }
      return false;
    }

    // --- 8. SEARCH ENGINE & KEYBOARD SHORTCUTS ---
    const searchInp = document.getElementById("search-input");
    const searchRes = document.getElementById("search-results");

    searchInp.addEventListener("input", (e) => {
      const q = e.target.value.toLowerCase().trim();
      if (!q) { searchRes.classList.add("hidden"); return; }

      const matches = root.descendants().filter(d => d.depth > 0 && d.data.name.toLowerCase().includes(q));
      searchRes.innerHTML = "";

      if (matches.length === 0) {
        searchRes.innerHTML = `<div class="p-3 text-gray-500 text-center">No matching categories found</div>`;
      } else {
        matches.slice(0, 8).forEach(m => {
          const pathStr = m.ancestors().reverse().map(a => a.data.name).join(" › ");
          const div = document.createElement("div");
          div.className = "p-3 hover:bg-white/10 cursor-pointer transition flex justify-between items-center";
          div.innerHTML = `
            <div class="truncate">
              <div class="font-semibold text-white truncate">${m.data.name}</div>
              <div class="text-[10px] text-gray-500 truncate">${pathStr}</div>
            </div>
            <span class="font-mono text-xs text-accent bg-accent/10 px-2 py-0.5 rounded ml-2">${m.value || 0}</span>
          `;
          div.onclick = () => {
            selectNode(m.data.id);
            focusOn(m.data.id);
            searchRes.classList.add("hidden");
            searchInp.value = "";
          };
          searchRes.appendChild(div);
        });
      }
      searchRes.classList.remove("hidden");
    });

    document.addEventListener("click", (e) => {
      if (!searchInp.contains(e.target) && !searchRes.contains(e.target)) searchRes.classList.add("hidden");
    });

    // Global Keyboard Navigation
    document.addEventListener("keydown", (e) => {
      if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;

      const currentD3 = findD3Node(selectedNodeId) || root;
      if (!currentD3) return;

      if (e.key === "ArrowDown" || e.key === "ArrowRight" || e.key === "Tab") {
        e.preventDefault();
        const siblings = currentD3.parent ? currentD3.parent.children : [root];
        const idx = siblings.indexOf(currentD3);
        const next = siblings[(idx + 1) % siblings.length];
        selectNode(next.data.id);
      } else if (e.key === "ArrowUp" || e.key === "ArrowLeft") {
        e.preventDefault();
        const siblings = currentD3.parent ? currentD3.parent.children : [root];
        const idx = siblings.indexOf(currentD3);
        const prev = siblings[(idx - 1 + siblings.length) % siblings.length];
        selectNode(prev.data.id);
      } else if (e.key === " " || e.key === "+") {
        e.preventDefault();
        quickInc(selectedNodeId, 1);
      } else if (e.key === "-") {
        e.preventDefault();
        quickInc(selectedNodeId, -1);
      } else if (e.key === "Enter") {
        e.preventDefault();
        if (currentD3.children && currentD3.children.length > 0) {
          focusOn(selectedNodeId);
        } else {
          enableManualEdit(selectedNodeId, currentD3.value || 0);
        }
      } else if (e.key === "Delete" || e.key === "Backspace") {
        if (selectedNodeId !== "root") {
          e.preventDefault();
          ctxTargetId = selectedNodeId;
          ctxAction('delete');
        }
      } else if (e.ctrlKey && e.key.toLowerCase() === "d") {
        e.preventDefault();
        ctxTargetId = selectedNodeId;
        ctxAction('duplicate');
      }
    });

    // --- 9. UTILITY HELPERS ---
    function findD3Node(id) { return root.descendants().find(d => d.data.id === id); }
    function findRawNode(node, id) {
      if (node.id === id) return node;
      if (node.children) {
        for (let c of node.children) {
          let f = findRawNode(c, id);
          if (f) return f;
        }
      }
      return null;
    }

    // --- 10. SYSTEM BOOTSTRAP ---
    window.addEventListener("DOMContentLoaded", async () => {
      await initDB();
      const saved = await loadTreeFromDB();
      if (saved && saved.children) treeData = saved;
      renderSunburst();

      // Responsive redraw on resize
      window.addEventListener("resize", () => {
        if (root) renderSunburst();
      });
    });
  </script>
</body>
